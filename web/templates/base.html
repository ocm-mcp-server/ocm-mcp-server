<!-- PNG, not the SVG banner: LinkedIn, X, Slack and Facebook all reject SVG
     for og:image and render no preview at all. Exported at 2400x1260 -
     the 1.91:1 ratio they crop cleanly, at 2x so it stays sharp on HiDPI
     displays and when downscaled into a feed. Source: web/og-card.html. -->
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
<link rel="stylesheet" href="{{css_href}}">
<script>
  // Dark is the default for everyone, regardless of OS preference — this is a
  // dark-first design and it is what the project should lead with. A visitor
  // who picks light with the toggle keeps it; nothing else overrides them.
  // Applied before first paint so there is no flash of the wrong theme.
  (() => {
    let t;
    try { t = localStorage.getItem("theme"); } catch { t = null; }
    document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
    // Motion: only an explicit choice is stamped here. With no attribute the
    // stylesheet falls through to the OS preference, which is the default.
    let m;
    try { m = localStorage.getItem("motion"); } catch { m = null; }
    if (m === "full" || m === "reduced") document.documentElement.dataset.motion = m;

    // Tell the stylesheet JavaScript is running, which is what allows it to
    // hide content for the reveal animation. Written in ES5 on purpose: if a
    // browser cannot parse site.js, it must still parse this.
    var root = document.documentElement;
    root.className += " js";
    // Safety net. If site.js never runs - blocked, offline, a parse error on an
    // older engine - nothing would ever add the .in class and the page would
    // stay blank. site.js clears this the moment it starts.
    window.__revealSafety = setTimeout(function () {
      root.className += " reveal-all";
    }, 2000);
  })();
</script>
</head>
