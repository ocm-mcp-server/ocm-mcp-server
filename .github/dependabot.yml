# Keep GitHub Actions and Python dependencies current. Action pins can move under
# tags, so Dependabot proposes updates (and their new SHAs) on a schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Hash-pinned CI build tools (see hack/requirements/README.md). Kept separate
  # from "/" so a tool bump never lands in the server's runtime closure.
  - package-ecosystem: pip
    directory: "/hack/requirements"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
