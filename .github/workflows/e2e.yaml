#
# Nightly end-to-end test: the same ./hack/e2e-local.sh a contributor runs locally,
# against a real kind-based OCM fleet with Kyverno admission - every tool, prompt,
# and resource, the gated write/rollback flows, the MCP protocol layer over stdio,
# a negative sweep proving the gates fail closed, and a break-then-fix scenario.
# Unit tests mock the cluster; this is the job that proves the real thing works.
name: e2e

on:
  schedule:
    - cron: "17 2 * * *" # nightly; catches breakage from upstream OCM/Kyverno/kind drift
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install clusteradm
        run: |
          # Upstream deleted the v0.9.x tags when the project renumbered to 1.x,
          # which 404'd this download and failed the job before any test ran.
          CLUSTERADM_VERSION=v1.3.1
          curl -fsSL -o /tmp/clusteradm_install.sh \
            "https://raw.githubusercontent.com/open-cluster-management-io/clusteradm/${CLUSTERADM_VERSION}/install.sh"
          INSTALL_DIR=/usr/local/bin bash /tmp/clusteradm_install.sh "$CLUSTERADM_VERSION"
          clusteradm version
      - name: Run the full end-to-end suite
        run: ./hack/e2e-local.sh
        env:
          SPOKES: "2"
      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            e2e-report.html
            wiki/Test-Results.md
          retention-days: 30
