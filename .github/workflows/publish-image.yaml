#
# Build and publish the container image to ghcr.io on every v* tag push, with an SBOM,
# build provenance, a keyless Cosign signature, and a vulnerability scan. It triggers on
# the tag push (NOT release:published) because a Release created by the built-in
# GITHUB_TOKEN does not start other workflows - so the image is guaranteed to build for
# every tagged release. Uses GITHUB_TOKEN and OIDC only; no external credentials.
name: publish-image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: pyproject.toml version)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write        # push to ghcr.io
      id-token: write        # keyless Cosign signing via OIDC
      attestations: write    # build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # The runner's default (docker-driver) builder cannot produce SBOM or
        # provenance attestations, nor index-level annotations; the
        # docker-container driver can.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A tag push carries the version in the ref; a manual dispatch does not.
      # type=semver silently produces NO tag without one, so a dispatched run
      # used to publish only :latest -- and server.json pins an exact version,
      # which the MCP Registry validates against the published package. That
      # combination fails the registry publish for a reason that looks unrelated.
      - name: Resolve the version to publish
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
            [ -n "$v" ] || v="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          else
            v="${REF_NAME#v}"
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "refusing to publish an invalid version: '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "publishing ghcr.io/${GITHUB_REPOSITORY}:$v and :latest"

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push (with SBOM + provenance)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # Ownership-verification marker for the official MCP Registry
          # (registry.modelcontextprotocol.io): proves this image backs the
          # server named io.github.ocm-mcp-server/ocm-mcp-server.
          annotations: |
            index,manifest:io.modelcontextprotocol.server.name=io.github.ocm-mcp-server/ocm-mcp-server

      - name: Scan the published image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the pushed image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the signature we just created
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${{ github.repository }}@${DIGEST}"
