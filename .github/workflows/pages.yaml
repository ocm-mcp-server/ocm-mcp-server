#
# Redirect the PROJECT site to the canonical ROOT site.
#
# This repository's Pages site is ocm-mcp-server.github.io/ocm-mcp-server/. The
# canonical site is the root, ocm-mcp-server.github.io/, which GitHub serves only
# from the repository named ocm-mcp-server.github.io - so the two cannot be the
# same deployment. They used to be two full copies of the same content, and only
# one of them was automated.
#
# Rather than unpublish this one, it now serves a redirect. Unpublishing would
# 404 every inbound link that already exists: the MCP Registry listing, the old
# repository homepage, anything anyone has bookmarked or written about. A
# redirect keeps all of them working and sends both people and crawlers to the
# canonical URL.
#
# The real site is built and published by publish-root-site.yaml.
name: pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Build the redirect page
        env:
          CANONICAL: https://ocm-mcp-server.github.io/
        run: |
          set -euo pipefail
          mkdir -p _redirect
          # rel=canonical for crawlers, http-equiv for browsers with JS off, and
          # a visible link so the page is not a dead end if both are ignored.
          cat > _redirect/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>ocm-mcp-server - moved</title>
            <link rel="canonical" href="${CANONICAL}">
            <meta http-equiv="refresh" content="0; url=${CANONICAL}">
            <meta name="robots" content="noindex">
          </head>
          <body>
            <p>This documentation now lives at
               <a href="${CANONICAL}">${CANONICAL}</a>.</p>
          </body>
          </html>
          HTML
          # Pages serves 404.html for any unmatched path, so deep links into the
          # old site land on the canonical root too instead of a bare 404.
          cp _redirect/index.html _redirect/404.html
          touch _redirect/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _redirect

  deploy:
    needs: redirect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
