name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests eval hack
      - name: Format check
        run: ruff format --check src tests eval
      - name: Type check
        run: mypy
      - name: Unit tests + coverage gate
        run: pytest -q --cov=ocm_mcp_server --cov-report=term-missing --cov-fail-under=95
      - name: Shell syntax
        run: bash -n hack/*.sh chaos/inject.sh chaos/scenarios/*.sh
      - name: Docs stats drift check (quoted counts match reality)
        run: python3 hack/docs_stats.py --check
      - name: Unit-test report + browsable coverage HTML (one matrix leg only)
        if: matrix.python-version == '3.12'
        run: make test-report
      - name: Upload unit-test + coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: |
            .unit-report/htmlcov
            .unit-report/junit.xml
            wiki/Unit-Test-Results.md
            wiki/coverage-badge.json
          retention-days: 30

  policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with:
          release: v1.18.2
      - name: Offline policy tests
        run: kyverno test deploy/policies/tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Guardrail <-> Kyverno parity contract
        # The same fixture corpus must get IDENTICAL verdicts from the Python
        # static guardrails (layer 1) and Kyverno admission (layer 2).
        run: |
          python3 -m pip install --require-hashes -r hack/requirements/parity.txt
          python3 hack/parity_contract.py

  dco:
    # Enforces the Developer Certificate of Origin that CONTRIBUTING.md, the PR
    # template and GOVERNANCE.md all already promise. Until this job existed the
    # policy was documented in eight files and checked in none - the only
    # commits on main that carried a sign-off were Dependabot's.
    #
    # Written inline rather than pulled from the marketplace, for the same
    # reason secret-scan runs the gitleaks binary: one less third-party action
    # in the supply chain, and nothing to license.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit must carry a Signed-off-by
        # The two SHAs are passed through env, never interpolated into the
        # script: ${{ }} inside a run block is a workflow-injection footgun even
        # when the value looks like a hex string.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # --no-merges: GitHub generates merge commits, and a contributor
          # cannot sign one they did not write.
          for c in $(git rev-list --no-merges "${BASE_SHA}".."${HEAD_SHA}"); do
            if git log -1 --format=%B "$c" \
                 | grep -qiE '^Signed-off-by: .+ <[^@]+@[^>]+>[[:space:]]*$'; then
              continue
            fi
            subject="$(git log -1 --format=%s "$c")"
            echo "::error::${c} is missing a Signed-off-by trailer: ${subject}"
            missing=1
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Sign your commits with 'git commit -s'. To fix a branch you have already pushed: git rebase --signoff ${BASE_SHA}..HEAD && git push --force-with-lease"
            exit 1
          fi
          echo "every commit in this pull request is signed off"

  dependency-review:
    # Flags known-vulnerable or disallowed-license dependencies added in a PR.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Runs the gitleaks BINARY, not gitleaks/gitleaks-action.
      #
      # gitleaks itself is MIT-licensed and free. The marketplace Action wrapper
      # is not: it requires a paid GITLEAKS_LICENSE for repositories owned by an
      # organization, and fails closed without one. Transferring this repo from a
      # personal account to an organization therefore broke this job with
      # "[ocm-mcp-server] is an organization. License key is required." — a
      # licensing change, not a security finding.
      #
      # Invoking the binary keeps exactly the same scan with no licence and no
      # third-party Action in the supply chain. Pinned by version AND sha256,
      # consistent with how every other dependency here is pinned.
      - name: gitleaks (pinned binary, no marketplace action)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          # Scan the full history; the checkout above already sets fetch-depth: 0.
          ./gitleaks detect --source . --redact --verbose --exit-code 1
