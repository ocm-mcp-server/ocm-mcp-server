name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests eval
      - name: Format check
        run: ruff format --check src tests eval
      - name: Type check
        run: mypy
      - name: Unit tests + coverage gate
        run: pytest -q --cov=ocm_mcp_server --cov-report=term-missing --cov-fail-under=45
      - name: Shell syntax
        run: bash -n hack/*.sh chaos/inject.sh chaos/scenarios/*.sh

  policy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0
        with:
          release: v1.18.2
      - name: Offline policy tests
        run: kyverno test deploy/policies/tests

  dependency-review:
    # Flags known-vulnerable or disallowed-license dependencies added in a PR.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
