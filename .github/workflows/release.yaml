#
# Create a GitHub Release automatically whenever a v* tag is pushed.
# Fills the repository's Releases section with no manual step.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent, but a real failure still fails the job (not masked).
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Deleting a tag demotes its release to a draft; if this tag was
            # re-cut, publish the orphaned draft instead of silently skipping.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "release for $TAG exists as a draft (tag was re-cut) - publishing it"
              gh release edit "$TAG" --tag "$TAG" --draft=false
            else
              echo "release for $TAG already exists"
            fi
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full list of changes in this release." \
            --verify-tag

  pypi:
    # Publish sdist + wheel to PyPI via OIDC trusted publishing: no stored token,
    # same keyless philosophy as the Cosign image signature.
    # One-time setup on pypi.org: add this repo/workflow as a trusted publisher
    # for the 'ocm-mcp-server' project (environment: pypi).
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ocm-mcp-server
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing + PEP 740 attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Version consistency gate (tag == pyproject == server.json == __init__ == chart)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          pv=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          sv=$(jq -r '.version' server.json)
          # Non-OCI packages carry a version field; OCI packages embed it in
          # the identifier tag (registry schema) - check both against the tag.
          pkgs=$(jq -r '[.packages[] | select(.registryType != "oci") | .version] | unique | join(",")' server.json)
          ociv=$(jq -r '[.packages[] | select(.registryType == "oci") | .identifier | split(":")[1]] | unique | join(",")' server.json)
          [ -z "$ociv" ] || [ "$ociv" = "$v" ] || { echo "OCI identifier tag '$ociv' != tag '$v'"; exit 1; }
          iv=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ocm_mcp_server/__init__.py)
          cv=$(sed -n 's/^version: \(.*\)$/\1/p' deploy/charts/ocm-mcp-server/Chart.yaml)
          av=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' deploy/charts/ocm-mcp-server/Chart.yaml)
          tv=$(sed -n 's/^ *tag: v\(.*\)$/\1/p' deploy/charts/ocm-mcp-server/values.yaml)
          if [ "$v" != "$pv" ] || [ "$v" != "$sv" ] || [ "$pkgs" != "$v" ] \
            || [ "$v" != "$iv" ] || [ "$v" != "$cv" ] || [ "$v" != "$av" ] || [ "$v" != "$tv" ]; then
            echo "::error::version drift: tag=$v pyproject=$pv server.json=$sv packages=$pkgs __init__=$iv chart=$cv appVersion=$av image.tag=$tv"
            echo "Cut releases with 'make release VERSION=x.y.z' to keep them in lockstep."
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --require-hashes -r hack/requirements/build.txt
          python -m build
      - name: Hand the exact built artifacts to the signing job
        # Uploading here (rather than rebuilding in sign-release) guarantees the
        # bytes attached to the GitHub Release are the same ones sent to PyPI.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Make tag-triggered re-runs idempotent: if this exact version is
          # already on PyPI, succeed instead of failing the whole release chain.
          skip-existing: true
          # PEP 740 attestations: Sigstore-signed provenance attached to the
          # PyPI copy of the package. This covers PyPI only - Scorecard's
          # Signed-Releases check reads GitHub *Release assets*, which is what
          # the sign-release job below supplies.
          attestations: true

  sign-release:
    # Attach the distributions and their Sigstore bundles to the GitHub Release.
    # Without this the Releases page carries no downloadable artifact at all:
    # the PEP 740 attestations live on PyPI and the Cosign signature lives in
    # the OCI registry, so anyone fetching from GitHub had nothing to verify.
    # Keyless, like the image signature - no key material is stored anywhere.
    needs: [release, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the GitHub Release
      id-token: write # GitHub OIDC identity for keyless Sigstore signing
      attestations: write # record the SLSA build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the artifacts that were published to PyPI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Generate SLSA build provenance for the distributions
        # A signature says "this repo signed these bytes"; provenance says
        # "this workflow, at this commit, produced them" - the stronger claim,
        # and the same guarantee the container image already ships.
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.tar.gz,dist/*.whl"
      - name: Publish the provenance bundle alongside the artifacts
        # The attestation also lives in GitHub's attestation store, but a
        # consumer downloading the tarball needs it next to the tarball.
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.intoto.jsonl
      - name: Sign the distributions with Sigstore
        # Writes {artifact}.sigstore.json next to each input.
        run: |
          python -m pip install --require-hashes -r hack/requirements/sigstore.txt
          python -m sigstore sign dist/*.tar.gz dist/*.whl
      - name: Verify the bundles before publishing them
        # Never ship a signature this workflow has not itself checked - same
        # rule the image pipeline follows with `cosign verify`.
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          python -m sigstore verify github dist/*.tar.gz dist/*.whl \
            --repository "$REPO" \
            --ref "$REF" \
            --trigger push
      - name: Attach distributions and bundles to the release
        # --clobber keeps a re-cut tag idempotent, matching skip-existing above.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber

  mcp-registry:
    # Publish server metadata to the official MCP Registry
    # (registry.modelcontextprotocol.io) after the PyPI package exists, since
    # the registry validates the mcp-name ownership marker in the PyPI README.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          # Release assets use Go arch names (amd64/arm64), not uname's x86_64.
          arch=$(uname -m); case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_${arch}.tar.gz" \
            | tar xz mcp-publisher
      - name: Stamp server.json version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          # OCI packages carry the version in the identifier tag and must NOT
          # have a separate "version" field (registry schema requirement).
          jq --arg v "$v" '
            .version = $v
            | (.packages[] | select(.registryType != "oci") | .version) = $v
            | (.packages[] | select(.registryType == "oci")) |=
                (del(.version) | .identifier |= ((split(":")[0]) + ":" + $v))
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # The freshly published PyPI release can take a moment to be visible
          # to the registry's validator; retry a few times before failing.
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish attempt ${attempt} failed; retrying in 30s"
            sleep 30
          done
          exit 1
