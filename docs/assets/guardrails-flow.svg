<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="The four guardrail layers between an AI agent and your clusters">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f6fb"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;}
      .h{font-weight:800;} .s{font-weight:600;}
      .cap{font-weight:700;letter-spacing:.06em;}
    
      /* Dark-mode pass. These drawings were made for a light page, but they are
         embedded in three places now - the GitHub README, the GitHub wiki, and a
         docs site that is dark by default - so on most surfaces they were a lit
         panel punched into a dark page, with slate text nobody could read.
         CSS beats presentation attributes, so the palette is remapped here
         rather than by rewriting every element. Saturated accents (emerald,
         rose, amber, blue) are deliberately left alone: they carry the meaning
         and they read on either ground. */
      @media (prefers-color-scheme: dark) {
        #gbg stop { stop-color: transparent; }
        [fill="#334155"] { fill: #c3cfe8; }
        [fill="#0f172a"] { fill: #eef2ff; }
        [fill="#64748b"] { fill: #93a3c4; }
        [fill="#94a3b8"] { fill: #8f9dbe; }
        [stroke="#94a3b8"] { stroke: #6f7da4; }
        [stroke="#64748b"] { stroke: #6f7da4; }
        [fill="#ecfdf5"] { fill: #10b98120; }
        [fill="#fff1f2"] { fill: #f43f5e20; }
        [fill="#fff7ed"] { fill: #f9731620; }
        [fill="#eff6ff"] { fill: #3b82f620; }
        [fill="#fefce8"] { fill: #ca8a0420; }
        [fill="#e2e8f0"] { fill: #24305c; }
        [fill="#cbd5e1"] { fill: #2c3a6e; }
        [fill="#065f46"] { fill: #5eead4; }
        [fill="#047857"] { fill: #5eead4; }
        [fill="#9f1239"] { fill: #fda4af; }
        [fill="#be123c"] { fill: #fda4af; }
        [fill="#9a3412"] { fill: #fdba74; }
        [fill="#854d0e"] { fill: #fde047; }
        [fill="#1e3a8a"] { fill: #93c5fd; }
      }
    </style>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="380" fill="url(#gbg)"/>
  <text x="40" y="52" class="t h" font-size="26" fill="#0f172a">Four guardrail layers, in order</text>
  <text x="40" y="80" class="t s" font-size="15" fill="#64748b">A change must pass every layer. None of them live in the prompt, so none can be talked out of.</text>

  <!-- agent -->
  <g transform="translate(40,150)">
    <rect width="150" height="120" rx="14" fill="#0f172a"/>
    <text x="75" y="52" class="t cap" font-size="12" fill="#7dd3fc" text-anchor="middle">AI AGENT</text>
    <text x="75" y="76" class="t s" font-size="12" fill="#cbd5e1" text-anchor="middle">any MCP client</text>
    <text x="75" y="96" class="t" font-size="11" fill="#94a3b8" text-anchor="middle">proposes a change</text>
  </g>
  <line x1="196" y1="210" x2="230" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- layer cards -->
  <g class="t" font-size="12.5">
    <!-- L1 -->
    <g transform="translate(236,150)">
      <rect width="230" height="120" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="26" cy="30" r="15" fill="#3b82f6"/><text x="26" y="35" fill="#fff" text-anchor="middle" class="h" font-size="14">1</text>
      <text x="52" y="35" class="s" font-size="15" fill="#1e3a8a">Static checks</text>
      <text x="20" y="62" fill="#334155">Restricted Pod Security:</text>
      <text x="20" y="80" fill="#334155">no root/priv-esc, drop-ALL,</text>
      <text x="20" y="98" fill="#334155">seccomp, GVK + image</text>
      <text x="20" y="116" fill="#334155">pinning, no host/Secret</text>
    </g>
    <line x1="472" y1="210" x2="506" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arw)"/>
    <!-- L2 -->
    <g transform="translate(512,150)">
      <rect width="230" height="120" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <circle cx="26" cy="30" r="15" fill="#f97316"/><text x="26" y="35" fill="#fff" text-anchor="middle" class="h" font-size="14">2</text>
      <text x="52" y="35" class="s" font-size="15" fill="#9a3412">Policy admission</text>
      <text x="20" y="66" fill="#334155">Kyverno dry-run on the hub,</text>
      <text x="20" y="86" fill="#334155">inside the ManifestWork</text>
      <text x="20" y="106" fill="#334155">envelope</text>
    </g>
    <line x1="748" y1="210" x2="782" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arw)"/>
    <!-- L3 -->
    <g transform="translate(788,150)">
      <rect width="230" height="120" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
      <circle cx="26" cy="30" r="15" fill="#ca8a04"/><text x="26" y="35" fill="#fff" text-anchor="middle" class="h" font-size="14">3</text>
      <text x="52" y="35" class="s" font-size="15" fill="#854d0e">Human approval</text>
      <text x="20" y="66" fill="#334155">Ed25519 token bound to the</text>
      <text x="20" y="86" fill="#334155">proposal content hash,</text>
      <text x="20" y="106" fill="#334155">minted on a trusted terminal</text>
    </g>
    <line x1="1024" y1="210" x2="1058" y2="210" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arw)"/>
    <!-- L4 -->
    <g transform="translate(1050,150)">
      <rect width="190" height="120" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <circle cx="26" cy="30" r="15" fill="#10b981"/><text x="26" y="35" fill="#fff" text-anchor="middle" class="h" font-size="14">4</text>
      <text x="52" y="35" class="s" font-size="15" fill="#065f46">RBAC</text>
      <text x="20" y="66" fill="#334155">least privilege;</text>
      <text x="20" y="86" fill="#334155">no Secrets, no exec,</text>
      <text x="20" y="106" fill="#334155">no stray deletes</text>
    </g>
  </g>

  <!-- outcome bar -->
  <g transform="translate(40,300)">
    <rect width="1200" height="46" rx="12" fill="#0f172a"/>
    <text x="24" y="29" class="t s" font-size="14" fill="#e2e8f0">Result:</text>
    <text x="92" y="29" class="t" font-size="14" fill="#94a3b8">the agent investigates freely, but a change reaches a cluster only after all four pass  -  applied, traced, and logged.</text>
  </g>
</svg>
