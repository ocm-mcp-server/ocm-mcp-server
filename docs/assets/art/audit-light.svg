<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 364" role="img" aria-label="Every tool call leaves two records: a hash-chained audit line, where editing an earlier line visibly breaks the chain, and an optional OpenTelemetry span showing where the time went, with the approval token never attached.">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .b{font-size:12px;font-weight:700}.xs{font-size:9.5px;letter-spacing:.06em}
    .s{font-size:11px}.cap{font-size:10px;font-weight:700;letter-spacing:.18em}
    .num{font-size:22px;font-weight:700}
    @keyframes dash{to{stroke-dashoffset:-40}}
    @keyframes glow{0%,100%{opacity:.22}50%{opacity:.44}}
    @keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}
    .wire{animation:dash 1.6s linear infinite}
    .glow{animation:glow 4s ease-in-out infinite}

    @keyframes appear{0%,6%{opacity:0;transform:translateY(-6px)}12%,100%{opacity:1;transform:translateY(0)}}
    @keyframes edit{0%,54%{opacity:0}58%,88%{opacity:1}94%,100%{opacity:0}}
    @keyframes hide{0%,54%{opacity:1}58%,88%{opacity:0}94%,100%{opacity:1}}
    @keyframes grow{0%,10%{transform:scaleX(0)}20%,100%{transform:scaleX(1)}}
    @keyframes fade{0%,8%{opacity:0}18%,100%{opacity:1}}
    .row{opacity:0}
    .r0{animation:appear 12s ease-out infinite}.r1{animation:appear 12s ease-out infinite .9s}
    .r2{animation:appear 12s ease-out infinite 1.8s}.r3{animation:appear 12s ease-out infinite 2.7s}
    .tamper{opacity:0;animation:edit 12s linear infinite}
    .sound{animation:hide 12s linear infinite}
    .span{animation:fade 12s ease-out infinite}
    .bar{transform-origin:left center;transform-box:fill-box;animation:grow 12s cubic-bezier(.2,.8,.3,1) infinite}
    .sp1 .bar{animation-delay:.4s}.sp2 .bar{animation-delay:.8s}
    .sp3 .bar{animation-delay:1.2s}.sp4 .bar{animation-delay:1.6s}
    @media (prefers-reduced-motion:reduce){
      .row,.span,.bar,.tamper{opacity:1;transform:none}.sound{opacity:0}}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1280" height="364" rx="18" fill="#fbfcff"/>
  <text x="40" y="44" text-anchor="start" class="mono cap" fill="#a78bfa">AUDIT LOG · ALWAYS ON · TAMPER-EVIDENT</text>
  <text x="700" y="44" text-anchor="start" class="mono cap" fill="#38bdf8">OTEL SPANS · OPT-IN · A DEBUGGING ARTIFACT</text>
  <text x="40" y="76" class="sans" font-size="16" font-weight="700" fill="#0f1729">What happened, in order, on whose authority</text>
  <text x="40" y="96" class="mono xs" fill="#5a6b8c">audit.jsonl — every line carries the hash of the line before it</text>
  <text x="700" y="76" class="sans" font-size="16" font-weight="700" fill="#0f1729">Where the time went</text>
  <text x="700" y="96" class="mono xs" fill="#5a6b8c">one span per tool call — the approval token is never attached</text>
  
  <g class="row r0">
    <rect x="56" y="128" width="568" height="34" rx="8" fill="#ffffff" stroke="#dfe6f5"/>
    <rect x="56" y="128" width="3" height="34" rx="1.5" fill="#22c55e"/>
    <text x="72" y="149" class="mono xs" fill="#5a6b8c">12:04:31</text>
    <text x="134" y="149" class="mono b" fill="#0f1729">get_fleet_status</text>
    <g><text x="386" y="149" class="mono xs" fill="#22c55e">read</text>
<text x="474" y="149" class="mono xs" fill="#5a6b8c">prev 8c1a…</text>
<circle cx="604" cy="145" r="4" fill="#22c55e" opacity=".8"/></g>
  </g>
  <g class="row r1">
    <path class="sound" d="M64 162 v14" stroke="#22c55e" stroke-width="2" stroke-linecap="round" opacity=".7"/><rect x="56" y="176" width="568" height="34" rx="8" fill="#ffffff" stroke="#dfe6f5"/>
    <rect x="56" y="176" width="3" height="34" rx="1.5" fill="#38bdf8"/>
    <text x="72" y="197" class="mono xs" fill="#5a6b8c">12:06:02</text>
    <text x="134" y="197" class="mono b" fill="#0f1729">propose_manifestwork</text>
    <g class="sound"><text x="386" y="197" class="mono xs" fill="#38bdf8">proposed</text>
<text x="474" y="197" class="mono xs" fill="#5a6b8c">prev 9f2c…</text>
<circle cx="604" cy="193" r="4" fill="#38bdf8" opacity=".8"/></g>
  </g>
  <g class="row r2">
    <path class="sound" d="M64 210 v14" stroke="#22c55e" stroke-width="2" stroke-linecap="round" opacity=".7"/><rect x="56" y="224" width="568" height="34" rx="8" fill="#ffffff" stroke="#dfe6f5"/>
    <rect x="56" y="224" width="3" height="34" rx="1.5" fill="#a78bfa"/>
    <text x="72" y="245" class="mono xs" fill="#5a6b8c">12:07:44</text>
    <text x="134" y="245" class="mono b" fill="#0f1729">apply_manifestwork</text>
    <g><text x="386" y="245" class="mono xs" fill="#a78bfa">applied</text>
<text x="474" y="245" class="mono xs" fill="#5a6b8c">prev 4d7b…</text>
<circle cx="604" cy="241" r="4" fill="#a78bfa" opacity=".8"/></g>
  </g>
  <g class="row r3">
    <path class="sound" d="M64 258 v14" stroke="#22c55e" stroke-width="2" stroke-linecap="round" opacity=".7"/><rect x="56" y="272" width="568" height="34" rx="8" fill="#ffffff" stroke="#dfe6f5"/>
    <rect x="56" y="272" width="3" height="34" rx="1.5" fill="#22c55e"/>
    <text x="72" y="293" class="mono xs" fill="#5a6b8c">12:09:10</text>
    <text x="134" y="293" class="mono b" fill="#0f1729">get_cluster_health</text>
    <g><text x="386" y="293" class="mono xs" fill="#22c55e">read</text>
<text x="474" y="293" class="mono xs" fill="#5a6b8c">prev b063…</text>
<circle cx="604" cy="289" r="4" fill="#22c55e" opacity=".8"/></g>
  </g><g class="tamper">
    <rect x="56" y="176" width="568" height="34" rx="8" fill="#f43f5e" fill-opacity=".13" stroke="#f43f5e"/>
    <rect x="56" y="176" width="3" height="34" rx="1.5" fill="#f43f5e"/>
    <text x="386" y="197" class="mono xs" fill="#f43f5e">edited</text>
    <text x="474" y="197" class="mono xs" fill="#f43f5e">prev 9f2c…</text>
    <line x1="470" y1="193" x2="546" y2="193" stroke="#f43f5e" stroke-width="1.4"/>
    <path d="M64 210 v14" stroke="#f43f5e" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g class="span sp0">
    <text x="700" y="144" class="mono xs" fill="#5a6b8c">tool.apply_manifestwork</text>
    <rect class="bar" x="880" y="134" width="300" height="12" rx="4" fill="#a78bfa" fill-opacity=".8"/>
    <text x="1188" y="144" class="mono xs" fill="#5a6b8c">300ms</text>
  </g>
  <g class="span sp1">
    <text x="700" y="180" class="mono xs" fill="#5a6b8c">guardrails.check</text>
    <rect class="bar" x="888" y="170" width="34" height="12" rx="4" fill="#8ea2ff" fill-opacity=".8"/>
    <text x="930" y="180" class="mono xs" fill="#5a6b8c">34ms</text>
  </g>
  <g class="span sp2">
    <text x="700" y="216" class="mono xs" fill="#5a6b8c">kyverno.dryrun</text>
    <rect class="bar" x="926" y="206" width="96" height="12" rx="4" fill="#38bdf8" fill-opacity=".8"/>
    <text x="1030" y="216" class="mono xs" fill="#5a6b8c">96ms</text>
  </g>
  <g class="span sp3">
    <text x="700" y="252" class="mono xs" fill="#5a6b8c">approval.verify</text>
    <rect class="bar" x="1028" y="242" width="28" height="12" rx="4" fill="#fb923c" fill-opacity=".8"/>
    <text x="1064" y="252" class="mono xs" fill="#5a6b8c">28ms</text>
  </g>
  <g class="span sp4">
    <text x="700" y="288" class="mono xs" fill="#5a6b8c">ocm.apply_work</text>
    <rect class="bar" x="1062" y="278" width="108" height="12" rx="4" fill="#22c55e" fill-opacity=".8"/>
    <text x="1178" y="288" class="mono xs" fill="#5a6b8c">108ms</text>
  </g>
  <g class="sound"><g><rect x="56" y="324" width="261.20000000000005" height="18" rx="6" fill="#22c55e" fill-opacity=".16" stroke="#22c55e" stroke-opacity=".45"/><text x="186.60000000000002" y="336.6" text-anchor="middle" class="mono xs" fill="#22c55e">chain verifies — line 4 back to line 1</text></g></g>
  <g class="tamper"><g><rect x="56" y="324" width="293.2" height="18" rx="6" fill="#f43f5e" fill-opacity=".16" stroke="#f43f5e" stroke-opacity=".45"/><text x="202.6" y="336.6" text-anchor="middle" class="mono xs" fill="#f43f5e">chain broken at line 2 — the record says so</text></g></g>
  <line x1="40" y1="358" x2="1240" y2="358" stroke="#dfe6f5"/>
  <text x="40" y="380" class="mono xs" fill="#5a6b8c">Nothing safety-related trusts the spans, which is why tracing can stay optional and fail-soft. The audit log is the artifact an incident report is written from.</text>
</svg>