[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocm-mcp-server"
version = "0.3.0"
description = "A guardrailed MCP server that lets AI agents operate multi-cluster Kubernetes fleets through an Open Cluster Management hub"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sandeep Bazar" }]
keywords = ["mcp", "kubernetes", "open-cluster-management", "ai-agents", "multicluster"]
dependencies = [
    # Upper bounds are deliberate: MCP v2 is a major rewrite and the Kubernetes client
    # bumps its major on each K8s minor, so we cap to a tested range and widen on purpose.
    "mcp>=1.9,<3",
    "kubernetes>=29.0.0,<37",
    "cryptography>=42",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/sandeepbazar/ocm-mcp-server"
Documentation = "https://github.com/sandeepbazar/ocm-mcp-server/wiki"
Changelog = "https://github.com/sandeepbazar/ocm-mcp-server/blob/main/CHANGELOG.md"
Issues = "https://github.com/sandeepbazar/ocm-mcp-server/issues"
"MCP Registry" = "https://registry.modelcontextprotocol.io/?q=ocm-mcp-server"

[project.scripts]
ocm-mcp-server = "ocm_mcp_server.server:main"
ocm-mcp = "ocm_mcp_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocm_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ocm_mcp_server"]
branch = true

[tool.coverage.report]
# Floor that ratchets: the suite covers 100% of statements and branches (all cluster
# paths mocked); CI enforces a 95% floor with --cov-fail-under so small additions
# don't hard-fail, with pragma: no cover reserved for genuinely unreachable lines.
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.11"
# The Kubernetes client ships no type stubs, so its imports are untyped. Ignore missing
# imports for third-party packages rather than failing type-check on unstubbed deps.
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["src/ocm_mcp_server"]

# The security-critical modules are type-checked strictly (check_untyped_defs), so an
# untyped helper in the trust boundary cannot hide a type error.
[[tool.mypy.overrides]]
module = [
    "ocm_mcp_server.approvals",
    "ocm_mcp_server.guardrails",
    "ocm_mcp_server.config",
    "ocm_mcp_server.tracing",
    "ocm_mcp_server.filelock",
    "ocm_mcp_server.metrics",
]
check_untyped_defs = true
