[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocm-mcp-server"
version = "0.2.0"
description = "A guardrailed MCP server that lets AI agents operate multi-cluster Kubernetes fleets through an Open Cluster Management hub"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sandeep Bazar" }]
keywords = ["mcp", "kubernetes", "open-cluster-management", "ai-agents", "multicluster"]
dependencies = [
    # Upper bounds are deliberate: MCP v2 is a major rewrite and the Kubernetes client
    # bumps its major on each K8s minor, so we cap to a tested range and widen on purpose.
    "mcp>=1.9,<2",
    "kubernetes>=29.0.0,<37",
    "cryptography>=42",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ocm-mcp-server = "ocm_mcp_server.server:main"
ocm-mcp = "ocm_mcp_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocm_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
