image:
  repository: ghcr.io/ocm-mcp-server/ocm-mcp-server
  tag: v0.6.0
  # Set an immutable digest for production (takes precedence over tag), e.g.
  # digest: sha256:0123...  -> the image is referenced as repository@sha256:...
  digest: ""
  pullPolicy: IfNotPresent

# State (proposals, spent-token ledger, audit log). emptyDir is lost on restart; enable a
# PVC for anything beyond evaluation, and ship the audit log to an external sink as well.
persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""

# Safe default posture for a shared deployment: reads only, no writes.
readOnly: true

# The server's least-privilege ServiceAccount (created by deploy/rbac.yaml).
serviceAccountName: ocm-mcp-server

# Name of a Secret holding ONLY the public approval verifier key
# (key: approval_ed25519.pub). The private signer never runs here.
verifierKeySecret: ocm-mcp-approval-pub

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
