#
# ============================================================================
# HONESTY NOTICE: this chart's Deployment is a SECURITY-SHAPE REFERENCE, not a
# working network deployment - until the authenticated HTTP transport lands,
# no MCP client can connect to it over the network. The server speaks MCP
# over stdio only; a Pod's stdio is not network-reachable. Use this template
# to see the correct RBAC, securityContext, and probe shape to replicate for
# whatever actually attaches to the process (e.g. a sidecar sharing stdio, or
# `kubectl exec`). `stdin: true` below keeps the pod alive (stdio held open)
# instead of crash-looping on stdin EOF; it does NOT make the server reachable
# over the network.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ocm-mcp-server
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ocm-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocm-mcp-server
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # stdio-only server: hold stdin open so the process does not see an
          # immediate EOF and crash-loop. This does NOT expose the server over
          # the network - see the HONESTY NOTICE at the top of this file.
          stdin: true
          tty: false
          env:
            - name: OCM_MCP_READ_ONLY
              value: {{ if .Values.readOnly }}"1"{{ else }}"0"{{ end }}
            - name: OCM_MCP_HOME
              value: /var/lib/ocm-mcp
            - name: OCM_MCP_VERIFIER_KEY
              value: /etc/ocm-mcp/approval_ed25519.pub
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/ocm-mcp
            - name: verifier-key
              mountPath: /etc/ocm-mcp
              readOnly: true
      volumes:
        - name: state
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-state
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: verifier-key
          secret:
            secretName: {{ .Values.verifierKeySecret }}
            optional: true
