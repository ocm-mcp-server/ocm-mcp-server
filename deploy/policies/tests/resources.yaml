        kind: Deployment
        metadata:
          name: debugger
          namespace: kube-system
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: debugger
          template:
            metadata:
              labels:
                app: debugger
            spec:
              containers:
                - name: debugger
                  image: registry.example.com/tools:1.0.0
---
# Missing namespace entirely: must be denied.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-no-namespace
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: floating-config
        data:
          key: value
---
# Disallowed kind (ClusterRoleBinding): must be denied.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-kind
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: sneaky-admin
          namespace: shop
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
          - kind: ServiceAccount
            name: default
            namespace: shop
---
# :latest image tag: must be denied.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-latest-tag
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: payments
          namespace: shop
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: payments
          template:
            metadata:
              labels:
                app: payments
            spec:
              containers:
                - name: payments
                  image: registry.example.com/payments:latest
---
# A compliant ClusterIP Service: must pass the service-exposure rule.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: good-service
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: v1
        kind: Service
        metadata:
          name: payments
          namespace: shop
        spec:
          type: ClusterIP
          selector:
            app: payments
          ports:
            - port: 80
---
# Spoofed API group (evil.example/v1 "Deployment"): the kind-only allowlist passes it,
# the exact-GVK policy must deny it. Content is otherwise fully compliant.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-gvk-spoof
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: evil.example/v1
        kind: Deployment
        metadata:
          name: impostor
          namespace: shop
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: impostor
          template:
            metadata:
              labels:
                app: impostor
            spec:
              automountServiceAccountToken: false
              containers:
                - name: impostor
                  image: registry.example.com/app:1.0.0
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    seccompProfile:
                      type: RuntimeDefault
                    capabilities:
                      drop: ["ALL"]
---
# NodePort Service: must be denied by the service-exposure rule.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-nodeport-service
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: v1
        kind: Service
        metadata:
          name: exposed
          namespace: shop
        spec:
          type: NodePort
          selector:
            app: payments
          ports:
            - port: 80
---
# ClusterIP Service smuggling externalIPs: must be denied.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-external-ips
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: v1
        kind: Service
        metadata:
          name: hijack
          namespace: shop
        spec:
          type: ClusterIP
          externalIPs:
            - 203.0.113.7
          selector:
            app: payments
          ports:
            - port: 80
---
# HPA with a runaway maxReplicas: must be denied by the HPA ceiling rule.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-hpa-ceiling
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        metadata:
          name: runaway
          namespace: shop
        spec:
          minReplicas: 1
          maxReplicas: 1000
          scaleTargetRef:
            apiVersion: apps/v1
            kind: Deployment
            name: payments
---
# PSS-compliant workload reading a Secret via env secretKeyRef: only the
# secret-access policy must fail, proving the check is independent of PSS.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-secret-env
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: exfil
          namespace: shop
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: exfil
          template:
            metadata:
              labels:
                app: exfil
            spec:
              automountServiceAccountToken: false
              containers:
                - name: exfil
                  image: registry.example.com/app:1.0.0
                  env:
                    - name: DB_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: db-credentials
                          key: password
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    seccompProfile:
                      type: RuntimeDefault
                    capabilities:
                      drop: ["ALL"]
---
# PSS-compliant workload projecting a serviceAccountToken volume: must be denied
# by the secret-access policy (the PSS volume deny-list does not see projected sources).
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-projected-token
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: tokengrab
          namespace: shop
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: tokengrab
          template:
            metadata:
              labels:
                app: tokengrab
            spec:
              automountServiceAccountToken: false
              volumes:
                - name: token
                  projected:
                    sources:
                      - serviceAccountToken:
                          path: token
              containers:
                - name: tokengrab
                  image: registry.example.com/app:1.0.0
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    seccompProfile:
                      type: RuntimeDefault
                    capabilities:
                      drop: ["ALL"]
---
# awsElasticBlockStore volume: NOT in the old deny-list (secret/hostPath/PVC/CSI/NFS),
# so only the volume ALLOW-list rule catches it - the gap that rule exists to close.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-volume-type
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: blockstore
          namespace: shop
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: blockstore
          template:
            metadata:
              labels:
                app: blockstore
            spec:
              automountServiceAccountToken: false
              volumes:
                - name: data
                  awsElasticBlockStore:
                    volumeID: vol-0123456789abcdef0
              containers:
                - name: blockstore
                  image: registry.example.com/app:1.0.0
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    seccompProfile:
                      type: RuntimeDefault
                    capabilities:
                      drop: ["ALL"]
---
# Targets openshift-gitops - not in the old enumerated list, caught only by the
# openshift-* prefix wildcard: must be denied.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-prefix-namespace
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: sneaky-config
          namespace: openshift-gitops
        data:
          key: value
---
# PSS-compliant except runAsUser 0: must be denied by the pod-security policy.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-run-as-root
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: rootly
          namespace: shop
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: rootly
          template:
            metadata:
              labels:
                app: rootly
            spec:
              automountServiceAccountToken: false
              containers:
                - name: rootly
                  image: registry.example.com/app:1.0.0
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 0
                    allowPrivilegeEscalation: false
                    seccompProfile:
                      type: RuntimeDefault
                    capabilities:
                      drop: ["ALL"]
---
# Eleven manifests in one proposal: must be denied by the manifest-count cap.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-too-many-manifests
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-0, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-1, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-2, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-3, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-4, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-5, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-6, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-7, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-8, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-9, namespace: shop}, data: {k: v}}
      - {apiVersion: v1, kind: ConfigMap, metadata: {name: cm-10, namespace: shop}, data: {k: v}}
---
# Unlabeled ManifestWork (human-created): policies must NOT apply - passes.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: human-created
  namespace: cluster2
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: platform-tool
          namespace: kube-system
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: platform-tool
          template:
            metadata:
              labels:
                app: platform-tool
            spec:
              hostNetwork: true
              containers:
                - name: tool
                  image: registry.example.com/platform:2.1.0
                  securityContext:
                    privileged: true
---
# A ManifestWork the server SA tried to create WITHOUT the managed-by label - the
# bypass require-ocm-mcp-managed-by-label closes. Content is otherwise clean.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: unlabeled-bypass
  namespace: cluster2
spec:
  workload:
    manifests:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: sneak
          namespace: shop
        data:
          a: b
---
# Compliant main container, but a privileged/non-compliant INIT container. Python guardrails
# catch this; the PSS policy must too (init containers are a real privilege path).
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-init-container
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: sneaky-init
          namespace: shop
        spec:
          selector:
            matchLabels:
              app: sneaky-init
          template:
            metadata:
              labels:
                app: sneaky-init
            spec:
              automountServiceAccountToken: false
              initContainers:
                - name: init
                  image: busybox:1.36
                  securityContext:
                    privileged: true
              containers:
                - name: app
                  image: registry.example.com/app:1.0.0
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    seccompProfile:
                      type: RuntimeDefault
                    capabilities:
                      drop: ["ALL"]
