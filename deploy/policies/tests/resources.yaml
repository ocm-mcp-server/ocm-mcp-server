#
# Test ManifestWorks for the guardrail policies. Runs entirely offline with
# the Kyverno CLI - no cluster, no OCM installation required:
#   kyverno test deploy/policies/tests
---
# A compliant agent proposal: allowed kind, safe namespace, pinned image.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: good-proposal
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: payments
          namespace: shop
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: payments
          template:
            metadata:
              labels:
                app: payments
            spec:
              automountServiceAccountToken: false
              containers:
                - name: payments
                  image: registry.k8s.io/e2e-test-images/agnhost:2.47
                  securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
                    seccompProfile:
                      type: RuntimeDefault
                    capabilities:
                      drop: ["ALL"]
---
# Restricted-PSS violation: no automount:false, no securityContext. Must be denied by
# restrict-manifestwork-pod-security (but it is correctly labelled, so it passes the
# label and kind policies - proving PSS is enforced independently of the label).
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-pod-security
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: sloppy
          namespace: shop
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: sloppy
          template:
            metadata:
              labels:
                app: sloppy
            spec:
              containers:
                - name: sloppy
                  image: registry.example.com/app:1.0.0
---
# Privileged container + hostNetwork: must be denied.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-privileged
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: sneaky
          namespace: shop
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: sneaky
          template:
            metadata:
              labels:
                app: sneaky
            spec:
              hostNetwork: true
              containers:
                - name: sneaky
                  image: registry.example.com/tools:1.0.0
                  securityContext:
                    privileged: true
---
# hostPath volume: must be denied.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-hostpath
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: logreader
          namespace: shop
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: logreader
          template:
            metadata:
              labels:
                app: logreader
            spec:
              volumes:
                - name: logs
                  hostPath:
                    path: /var/log
              containers:
                - name: logreader
                  image: registry.example.com/tools:1.0.0
---
# Targets kube-system: must be denied.
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: bad-namespace
  namespace: cluster2
  labels:
    app.kubernetes.io/managed-by: ocm-mcp-server
