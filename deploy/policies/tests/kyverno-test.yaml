#
# Offline test suite for the guardrail policies, following the
# kyverno/policies repository conventions:
#   kyverno test deploy/policies/tests
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: manifestwork-guardrails
policies:
  - ../disallow-privileged-manifestwork.yaml
  - ../protect-system-namespaces.yaml
  - ../restrict-manifestwork-kinds.yaml
  - ../require-managed-by-label.yaml
  - ../restrict-manifestwork-pod-security.yaml
  - ../restrict-manifestwork-gvk.yaml
  - ../restrict-manifestwork-service-hpa.yaml
  - ../disallow-manifestwork-secret-access.yaml
  - ../limit-manifestwork-manifests.yaml
resources:
  - resources.yaml
userinfo: userinfo.yaml
results:
  # ---- restrict-manifestwork-pod-security (parity with the Python guardrails)
  - policy: restrict-manifestwork-pod-security
    rule: require-restricted-pod-security
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  - policy: restrict-manifestwork-pod-security
    rule: require-restricted-pod-security
    kind: ManifestWork
    resources: [cluster2/bad-pod-security]
    result: fail
  - policy: restrict-manifestwork-pod-security
    rule: require-restricted-pod-security
    kind: ManifestWork
    resources: [cluster2/bad-init-container]
    result: fail
  # ---- require-ocm-mcp-managed-by-label (closes the label-bypass)
  - policy: require-ocm-mcp-managed-by-label
    rule: require-label-from-server-sa
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  - policy: require-ocm-mcp-managed-by-label
    rule: require-label-from-server-sa
    kind: ManifestWork
    resources: [cluster2/unlabeled-bypass]
    result: fail
  # ---- disallow-privileged-manifestwork
  - policy: disallow-privileged-manifestwork
    rule: deny-privileged-embedded-specs
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  - policy: disallow-privileged-manifestwork
    rule: deny-privileged-embedded-specs
    kind: ManifestWork
    resources: [cluster2/bad-privileged, cluster2/bad-hostpath]
    result: fail
  # ---- protect-system-namespaces-manifestwork
  - policy: protect-system-namespaces-manifestwork
    rule: require-safe-namespace
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  - policy: protect-system-namespaces-manifestwork
    rule: require-safe-namespace
    kind: ManifestWork
    resources: [cluster2/bad-namespace, cluster2/bad-no-namespace]
    result: fail
  # ---- restrict-manifestwork-kinds
  - policy: restrict-manifestwork-kinds
    rule: allowlist-kinds
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  - policy: restrict-manifestwork-kinds
    rule: allowlist-kinds
    kind: ManifestWork
    resources: [cluster2/bad-kind]
    result: fail
  - policy: restrict-manifestwork-kinds
    rule: require-pinned-images
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  - policy: restrict-manifestwork-kinds
    rule: require-pinned-images
    kind: ManifestWork
    resources: [cluster2/bad-latest-tag]
    result: fail
  # ---- restrict-manifestwork-kinds: image pinning also covers initContainers
  # and ephemeralContainers, not just main containers (closes the gap where a
  # compromised server could slip an unpinned init/ephemeral image past this
  # backstop while the Python guardrail already catches it).
  - policy: restrict-manifestwork-kinds
    rule: require-pinned-images
    kind: ManifestWork
    resources: [cluster2/good-init-container-pinned]
    result: pass
  - policy: restrict-manifestwork-kinds
    rule: require-pinned-images
    kind: ManifestWork
    resources: [cluster2/bad-init-latest-tag, cluster2/bad-ephemeral-unpinned-image]
    result: fail
  # ---- restrict-manifestwork-pod-security: runAsUser 0 (parity with guardrails)
  - policy: restrict-manifestwork-pod-security
    rule: require-restricted-pod-security
    kind: ManifestWork
    resources: [cluster2/bad-run-as-root]
    result: fail
  # ---- protect-system-namespaces: prefix wildcards catch the long tail
  - policy: protect-system-namespaces-manifestwork
    rule: require-safe-namespace
    kind: ManifestWork
    resources: [cluster2/bad-prefix-namespace]
    result: fail
  # ---- restrict-manifestwork-gvk (exact apiVersion/kind, closes group spoofing)
  - policy: restrict-manifestwork-gvk
    rule: allowlist-gvk
    kind: ManifestWork
    resources: [cluster2/good-proposal, cluster2/good-service]
    result: pass
  - policy: restrict-manifestwork-gvk
    rule: allowlist-gvk
    kind: ManifestWork
    resources: [cluster2/bad-gvk-spoof]
    result: fail
  # the kind-only allowlist is blind to the spoofed group - the exact-GVK policy
  # is what closes it (this pass documents WHY the second policy exists)
  - policy: restrict-manifestwork-kinds
    rule: allowlist-kinds
    kind: ManifestWork
    resources: [cluster2/bad-gvk-spoof]
    result: pass
  # ---- restrict-manifestwork-service-hpa
  - policy: restrict-manifestwork-service-hpa
    rule: allowlist-service-type
    kind: ManifestWork
    resources: [cluster2/good-service, cluster2/good-proposal]
    result: pass
  - policy: restrict-manifestwork-service-hpa
    rule: allowlist-service-type
    kind: ManifestWork
    resources: [cluster2/bad-nodeport-service, cluster2/bad-external-ips]
    result: fail
  - policy: restrict-manifestwork-service-hpa
    rule: cap-hpa-max-replicas
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  - policy: restrict-manifestwork-service-hpa
    rule: cap-hpa-max-replicas
    kind: ManifestWork
    resources: [cluster2/bad-hpa-ceiling]
    result: fail
  # ---- disallow-manifestwork-secret-access
  - policy: disallow-manifestwork-secret-access
    rule: deny-secret-env-refs
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  - policy: disallow-manifestwork-secret-access
    rule: deny-secret-env-refs
    kind: ManifestWork
    resources: [cluster2/bad-secret-env, cluster2/bad-projected-token]
    result: fail
  - policy: disallow-manifestwork-secret-access
    rule: allowlist-volume-types
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  # awsElasticBlockStore is NOT caught by the PSS volume deny-list - only the
  # allow-list rule rejects it (the gap this rule closes)
  - policy: disallow-manifestwork-secret-access
    rule: allowlist-volume-types
    kind: ManifestWork
    resources: [cluster2/bad-volume-type]
    result: fail
  - policy: restrict-manifestwork-pod-security
    rule: require-restricted-pod-security
    kind: ManifestWork
    resources: [cluster2/bad-volume-type]
    result: pass
  # ---- limit-manifestwork-manifests
  - policy: limit-manifestwork-manifests
    rule: cap-manifest-count
    kind: ManifestWork
    resources: [cluster2/good-proposal]
    result: pass
  - policy: limit-manifestwork-manifests
    rule: cap-manifest-count
    kind: ManifestWork
    resources: [cluster2/bad-too-many-manifests]
    result: fail
  # ---- label scoping: human-created (unlabeled) work is not matched → skip
  - policy: disallow-privileged-manifestwork
    rule: deny-privileged-embedded-specs
    kind: ManifestWork
    resources: [cluster2/human-created]
    result: skip
  - policy: protect-system-namespaces-manifestwork
    rule: require-safe-namespace
    kind: ManifestWork
    resources: [cluster2/human-created]
    result: skip
  - policy: restrict-manifestwork-gvk
    rule: allowlist-gvk
    kind: ManifestWork
    resources: [cluster2/human-created]
    result: skip
  - policy: disallow-manifestwork-secret-access
    rule: deny-secret-env-refs
    kind: ManifestWork
    resources: [cluster2/human-created]
    result: skip
