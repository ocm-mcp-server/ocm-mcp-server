# Allowlist of resource kinds an agent proposal may contain, plus pinned-image
# hygiene. Everything not explicitly allowed is denied.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-manifestwork-kinds
  annotations:
    policies.kyverno.io/title: Restrict Kinds and Images in Agent ManifestWorks
    policies.kyverno.io/category: Multi-Cluster Guardrails
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ManifestWork
    policies.kyverno.io/description: >-
      Agent-proposed ManifestWorks may only contain a small allowlist of
      workload kinds, and every container image must be pinned to an explicit
      tag or digest (no :latest, no floating tags).
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: allowlist-kinds
      match:
        any:
          - resources:
              kinds:
                - work.open-cluster-management.io/v1/ManifestWork
              selector:
                matchLabels:
                  app.kubernetes.io/managed-by: ocm-mcp-server
      validate:
        message: >-
          Embedded manifest kind is not in the agent allowlist (Deployment,
          Service, ConfigMap, HorizontalPodAutoscaler, PodDisruptionBudget,
          ResourceQuota, NetworkPolicy).
        foreach:
          - list: request.object.spec.workload.manifests
            deny:
              conditions:
                all:
                  - key: "{{ element.kind }}"
                    operator: AnyNotIn
                    value:
                      - Deployment
                      - Service
                      - ConfigMap
                      - HorizontalPodAutoscaler
                      - PodDisruptionBudget
                      - ResourceQuota
                      - NetworkPolicy
    - name: require-pinned-images
      match:
        any:
          - resources:
              kinds:
                - work.open-cluster-management.io/v1/ManifestWork
              selector:
                matchLabels:
                  app.kubernetes.io/managed-by: ocm-mcp-server
      validate:
        message: >-
          Container images in embedded manifests must be pinned to an explicit
          tag or digest; ':latest' and tagless images are not allowed. This
          applies to regular containers, initContainers, and
          ephemeralContainers alike - an unpinned init or ephemeral container
          image is the same supply-chain risk as an unpinned main one.
        foreach:
          - list: request.object.spec.workload.manifests
            deny:
              conditions:
                any:
                  - key: "{{ length(element.spec.template.spec.containers[?ends_with(image, ':latest')] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ length(element.spec.template.spec.containers[?!contains(image, ':')] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
                  # initContainers may be absent - `|| `[]`` keeps the JMESPath
                  # filter from erroring on a missing list.
                  - key: "{{ length(element.spec.template.spec.initContainers[?ends_with(image, ':latest')] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ length(element.spec.template.spec.initContainers[?!contains(image, ':')] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
                  # ephemeralContainers likewise may be absent, and are already
                  # blanket-denied by restrict-manifestwork-pod-security - this
                  # check is defense in depth if that policy is ever disabled.
                  - key: "{{ length(element.spec.template.spec.ephemeralContainers[?ends_with(image, ':latest')] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ length(element.spec.template.spec.ephemeralContainers[?!contains(image, ':')] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
