# Closes every indirect path to Secret contents and host/storage data that the
# pod-security policy's volume deny-list does not cover, mirroring the Python guardrails:
# no env var may read a Secret (secretKeyRef / envFrom secretRef), no projected volume may
# carry a serviceAccountToken or secret source, and volume types are an ALLOW-list
# (configMap, emptyDir, downwardAPI, projected) - so exotic sources like
# awsElasticBlockStore or gitRepo are rejected too, not just the enumerated bad ones.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-manifestwork-secret-access
  annotations:
    policies.kyverno.io/title: Disallow Secret Access and Unlisted Volume Types in Agent ManifestWorks
    policies.kyverno.io/category: Multi-Cluster Guardrails
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ManifestWork
    policies.kyverno.io/description: >-
      Embedded workloads may not read Secrets through env vars, may not project
      serviceAccountTokens or secrets into volumes, and may only use the
      configMap, emptyDir, downwardAPI, and projected volume types.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: deny-secret-env-refs
      match:
        any:
          - resources:
              kinds:
                - work.open-cluster-management.io/v1/ManifestWork
              selector:
                matchLabels:
                  app.kubernetes.io/managed-by: ocm-mcp-server
      validate:
        message: >-
          Embedded workloads may not read Secrets via env secretKeyRef or
          envFrom secretRef, and may not project a serviceAccountToken or
          secret into a volume - there is no path to Secret contents.
        foreach:
          - list: request.object.spec.workload.manifests
            preconditions:
              all:
                - key: "{{ element.kind }}"
                  operator: AnyIn
                  value:
                    - Deployment
                    - StatefulSet
                    - DaemonSet
                    - ReplicaSet
                    - Job
            deny:
              conditions:
                any:
                  - key: "{{ length(element.spec.template.spec.containers[?env[?valueFrom.secretKeyRef]] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ length(element.spec.template.spec.containers[?envFrom[?secretRef]] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ length(element.spec.template.spec.initContainers[?env[?valueFrom.secretKeyRef]] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ length(element.spec.template.spec.initContainers[?envFrom[?secretRef]] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
                  - key: "{{ length(element.spec.template.spec.volumes[?projected.sources[?secret || serviceAccountToken]] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
    - name: allowlist-volume-types
      match:
        any:
          - resources:
              kinds:
                - work.open-cluster-management.io/v1/ManifestWork
              selector:
                matchLabels:
                  app.kubernetes.io/managed-by: ocm-mcp-server
      validate:
        message: >-
          Embedded workloads may only use configMap, emptyDir, downwardAPI, and
          projected volumes; every other volume type is a data- or host-access
          path and is rejected.
        foreach:
          - list: request.object.spec.workload.manifests
            preconditions:
              all:
                - key: "{{ element.kind }}"
                  operator: AnyIn
                  value:
                    - Deployment
                    - StatefulSet
                    - DaemonSet
                    - ReplicaSet
                    - Job
            deny:
              conditions:
                any:
                  - key: "{{ length(element.spec.template.spec.volumes[?!(configMap || emptyDir || downwardAPI || projected)] || `[]`) }}"
                    operator: GreaterThan
                    value: 0
